<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物画像网络</title><style>
body{margin:0;background:#f5f7fb;color:#172033;font:14px Arial,"Microsoft Yahei"}header{padding:20px 30px;background:#fff;border-bottom:1px solid #e5e9f2;font-size:20px;font-weight:bold}.layout{display:grid;grid-template-columns:270px 1fr 330px;gap:16px;padding:18px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:15px;padding:17px;box-shadow:0 3px 14px #263b6508}.field{margin:10px 0}label{display:block;color:#72809a;font-size:12px;margin-bottom:4px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #e5e9f2;border-radius:8px;padding:8px;font:inherit}textarea{min-height:60px}.btn{width:100%;border:0;border-radius:8px;padding:9px;margin-top:5px;background:#596df6;color:#fff;font-weight:bold;cursor:pointer}.btn.light{background:#edf0ff;color:#5265d7}.profile{padding:9px;border-radius:8px;display:flex;justify-content:space-between;cursor:pointer}.profile.active{background:#eef0ff;color:#5265d7}.profile button,.event button{border:0;background:none;color:#b44;cursor:pointer}.center{display:flex;flex-direction:column;gap:16px}.hero{display:flex;justify-content:space-between}.avatar{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#aab2ff;margin-right:10px;font-size:20px}.network{height:330px;background:#fafaff}.network svg{width:100%;height:100%}.edge{stroke:#ccd3e5;stroke-width:2}.node circle{stroke:#fff;stroke-width:4}.node text{font-size:12px;font-weight:bold;fill:#3d4760}.main circle{fill:#6675f5}.trait circle{fill:#a58bfa}.eventn circle{fill:#79c8bb}.event{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #e5e9f2}.date{width:70px;color:#72809a;font-size:11px}.event p{margin:3px 0;color:#68748b;font-size:12px}.metric{margin:12px 0}.bar{height:7px;background:#edf0f6;border-radius:8px}.bar i{display:block;height:100%;background:#7965ed;border-radius:8px}.insight,.forecast{background:#f8f7ff;border-radius:10px;padding:10px;margin-top:10px;font-size:12px}.empty{text-align:center;color:#72809a;padding:16px;font-size:12px}@media(max-width:1000px){.layout{grid-template-columns:1fr}}
</style><header>人物画像网络 <span style="float:right;color:#199d73;font-size:12px">● 本地自动保存</span></header><main class="layout"><aside class="card"><h3>人物管理</h3><input id="newName" placeholder="人物姓名"><button class="btn" id="newProfile">新建人物</button><div id="profiles"></div><hr><h3>添加行为数据</h3><label>事件 / 行为</label><textarea id="event" placeholder="例如：被公开批评后不再联系同事"></textarea><label>时间</label><input id="date" type="date"><label>情绪标签</label><input id="emotion" placeholder="焦虑、羞耻"><label>性格 / 动机标签</label><input id="traits" placeholder="敏感、责任感"><label>你的观察</label><textarea id="note"></textarea><button class="btn" id="add">加入当前人物</button></aside><section class="center"><div class="card hero"><div><span class="avatar" id="avatar">?</span><b id="personName">请先新建人物</b><small><br><span id="count">0</span> 条记录</small></div><div style="text-align:right">画像完整度<br><b id="complete" style="font-size:25px;color:#795ce8">0%</b></div></div><div class="card network"><svg viewBox="0 0 700 330"><line class="edge" x1="350" y1="160" x2="170" y2="70"/><line class="edge" x1="350" y1="160" x2="530" y2="70"/><line class="edge" x1="350" y1="160" x2="170" y2="260"/><line class="edge" x1="350" y1="160" x2="530" y2="260"/><g class="node main"><circle cx="350" cy="160" r="40"/><text x="350" y="165" text-anchor="middle" fill="white" id="svgName">人物</text></g><g class="node trait"><circle cx="170" cy="70" r="30"/><text x="170" y="75" text-anchor="middle">敏感</text></g><g class="node trait"><circle cx="530" cy="70" r="30"/><text x="530" y="75" text-anchor="middle">责任感</text></g><g class="node eventn"><circle cx="170" cy="260" r="33"/><text x="170" y="265" text-anchor="middle">回避冲突</text></g><g class="node eventn"><circle cx="530" cy="260" r="33"/><text x="530" y="265" text-anchor="middle">寻求认可</text></g></svg></div><div class="card"><h3>行为时间线</h3><div id="timeline"><div class="empty">暂无记录</div></div></div></section><aside class="card"><h3>输入行为，判断动机</h3><div style="color:#72809a;font-size:12px">结合当前人物历史数据生成解释</div><textarea id="query" placeholder="例如：他突然拒绝参加团队聚会"></textarea><button class="btn" id="analyze">分析行为动机</button><div id="result" class="insight">等待输入</div><h3>当前画像</h3><div id="metrics"><div class="empty">暂无数据</div></div></aside></main><script>
const db=JSON.parse(localStorage.getItem('portrait-network-v3')||'{"current":null,"profiles":[]}'),$=i=>document.getElementById(i),today=new Date().toISOString().slice(0,10);$('date').value=today;function save(){localStorage.setItem('portrait-network-v3',JSON.stringify(db))}function cur(){return db.profiles.find(p=>p.id===db.current)}function render(){let p=cur();$('profiles').innerHTML=db.profiles.length?db.profiles.map(x=>`<div class="profile ${x.id===db.current?'active':''}" onclick="selectP('${x.id}')">${x.name} (${x.events.length}) <button onclick="event.stopPropagation();removeP('${x.id}')">删除</button></div>`).join(''):'<div class="empty">暂无人物</div>';if(!p){$('personName').textContent='请先新建人物';return}$('personName').textContent=p.name;$('avatar').textContent=p.name[0];$('svgName').textContent=p.name.slice(0,4);$('count').textContent=p.events.length;$('complete').textContent=Math.min(20+p.events.length*12,96)+'%';$('timeline').innerHTML=p.events.length?p.events.slice().reverse().map(e=>`<div class="event"><div class="date">${e.date}</div><div style="flex:1"><b>${e.text}</b><p>${[...e.emotions,...e.traits].join(' · ')}${e.note?' · '+e.note:''}</p></div><button onclick="removeE('${e.id}')">删除</button></div>`).join(''):'<div class="empty">暂无记录</div>';let tags=[...new Set(p.events.flatMap(e=>[...e.traits,...e.emotions]))];$('metrics').innerHTML=tags.length?tags.slice(0,6).map((t,i)=>`<div class="metric">${t} <b>${62+i*5}%</b><div class="bar"><i style="width:${62+i*5}%"></i></div></div>`).join(''):'<div class="empty">添加行为后生成画像</div>';save()}function selectP(id){db.current=id;render()}function removeP(id){if(confirm('确定删除人物及全部数据吗？')){db.profiles=db.profiles.filter(p=>p.id!==id);db.current=db.profiles[0]?.id||null;render()}}function removeE(id){let p=cur();p.events=p.events.filter(e=>e.id!==id);render()}$('newProfile').onclick=()=>{let n=$('newName').value.trim();if(!n)return;let p={id:Date.now().toString(),name:n,events:[]};db.profiles.push(p);db.current=p.id;$('newName').value='';render()};$('add').onclick=()=>{let p=cur(),t=$('event').value.trim();if(!p)return alert('请先新建人物');if(!t)return;$('event').value='';let es=$('emotion').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),ts=$('traits').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);p.events.push({id:Date.now().toString(),text:t,date:$('date').value||today,emotions:es,traits:ts,note:$('note').value});['emotion','traits','note'].forEach(i=>$(i).value='');render()};$('analyze').onclick=()=>{let p=cur(),q=$('query').value.trim();if(!p||!q)return $('result').innerHTML='<b>无法分析</b> 请先选择人物并输入行为。';let tags=p.events.flatMap(e=>[...e.emotions,...e.traits]),hit=tags[0]||'心理安全';$('result').innerHTML=`<b>可能的核心动机</b><br>“${hit}”可能是关键线索：该行为可能用于降低压力、保护自尊或恢复控制感。<div class="forecast"><b>判断依据</b>历史中已有 ${p.events.length} 条记录，重复出现的情绪和标签为：${[...new Set(tags)].slice(0,5).join('、')||'暂无标签'}。<br><br>这是概率性解释，不是确定诊断。</div>`};render();
</script></html>
