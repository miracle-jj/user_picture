<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>人物画像网络</title>
<style>
:root{--bg:#f6f8fc;--ink:#172033;--muted:#748099;--line:#e6eaf2;--blue:#536dfe;--purple:#845ef7;--card:#fff;--green:#19a974}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"PingFang SC",Microsoft Yahei,sans-serif}header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 34px;justify-content:space-between}h1{font-size:20px;margin:0;letter-spacing:.5px}.brand{display:flex;gap:12px;align-items:center}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#536dfe,#9c6bff);display:grid;place-items:center;color:white;font-weight:800}.status{color:var(--green);font-size:13px}.layout{display:grid;grid-template-columns:290px 1fr 330px;gap:18px;padding:20px;min-height:calc(100vh - 72px)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px #25385808}.panel{padding:18px}.panel h2{font-size:15px;margin:0 0 14px}.sub{color:var(--muted);font-size:12px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit;outline:none;background:#fbfcff}input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #536dfe18}textarea{resize:vertical;min-height:68px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:white;font-weight:600;cursor:pointer;width:100%;margin-top:6px}.btn.secondary{background:#eef1ff;color:#5268da}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{border-radius:99px;background:#f0efff;color:#6652d9;padding:5px 9px;font-size:12px}.tag button{border:0;background:none;color:inherit;margin-left:4px;cursor:pointer}.center{display:flex;flex-direction:column;gap:18px}.hero{padding:20px;display:flex;justify-content:space-between;align-items:center}.person{display:flex;align-items:center;gap:13px}.avatar{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#d8dcff,#8d98ff);display:grid;place-items:center;font-size:22px}.score{text-align:right}.score strong{font-size:28px;color:var(--purple)}.network{height:400px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 48%,#f1f2ff,white 54%)}.network svg{width:100%;height:100%}.node{cursor:pointer}.node circle{stroke:#fff;stroke-width:4}.node text{font-size:12px;fill:#3d4760;font-weight:600}.node.main circle{fill:#6575f7}.node.trait circle{fill:#a58bfa}.node.event circle{fill:#79c8bb}.edge{stroke:#cbd2e5;stroke-width:2}.legend{position:absolute;bottom:13px;left:16px;display:flex;gap:14px;color:var(--muted);font-size:11px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}.timeline{padding:18px}.event{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.event:last-child{border:0}.event .date{color:var(--muted);font-size:11px;width:70px}.event b{font-size:13px}.event p{margin:3px 0 0;color:#657087;font-size:12px}.analysis{padding:18px}.metric{margin:12px 0}.metric-top{display:flex;justify-content:space-between;font-size:12px}.bar{height:7px;border-radius:8px;background:#edf0f6;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#6675f5,#a875f7)}.insight{background:#f8f7ff;border-radius:11px;padding:12px;margin-top:13px;font-size:12px}.insight b{display:block;color:#5544c5;margin-bottom:4px}.forecast{border-left:3px solid #806cf5;padding-left:10px;margin-top:12px;font-size:12px}.empty{color:var(--muted);font-size:12px;text-align:center;padding:20px 0}@media(max-width:1000px){.layout{grid-template-columns:1fr}.network{height:360px}}
</style></head>
<body>
<header><div class="brand"><div class="logo">网</div><h1>人物画像网络</h1></div><div class="status">● 本地数据已自动保存</div></header>
<main class="layout">
<aside class="card panel"><h2>持续输入</h2><div class="sub">每一条记录都会丰富人物网络</div>
<div class="field"><label>事件 / 行为</label><textarea id="event" placeholder="例如：被公开批评后，三天没有主动联系同事"></textarea></div>
<div class="field"><label>发生时间</label><input id="date" type="date"></div>
<div class="field"><label>情绪标签</label><input id="emotion" placeholder="焦虑、羞耻、兴奋（用逗号分隔）"></div>
<div class="field"><label>性格 / 动机标签</label><input id="traits" placeholder="敏感、责任感、寻求认可"></div>
<div class="field"><label>你的观察</label><textarea id="note" placeholder="你认为这件事说明了什么？"></textarea></div>
<button class="btn" id="add">加入画像网络</button><button class="btn secondary" id="demo">填入示例数据</button>
<div style="margin-top:20px"><h2>已收集标签</h2><div class="tags" id="tagbox"><span class="empty">暂无标签</span></div></div>
</aside>
<section class="center"><div class="card hero"><div class="person"><div class="avatar">张</div><div><h2 style="margin:0">张三</h2><div class="sub">持续更新中的人物画像 · <span id="count">0</span> 条事件</div></div></div><div class="score"><div class="sub">画像完整度</div><strong id="completeness">18%</strong></div></div>
<div class="card network"><svg viewBox="0 0 700 400"><g class="edges"><line class="edge" x1="350" y1="200" x2="170" y2="100"/><line class="edge" x1="350" y1="200" x2="530" y2="105"/><line class="edge" x1="350" y1="200" x2="150" y2="290"/><line class="edge" x1="350" y1="200" x2="540" y2="285"/><line class="edge" x1="170" y1="100" x2="150" y2="290"/></g><g class="node main"><circle cx="350" cy="200" r="43"/><text x="350" y="205" text-anchor="middle" fill="white">张三</text></g><g class="node trait"><circle cx="170" cy="100" r="31"/><text x="170" y="105" text-anchor="middle">敏感</text></g><g class="node trait"><circle cx="530" cy="105" r="31"/><text x="530" y="110" text-anchor="middle">责任感</text></g><g class="node event"><circle cx="150" cy="290" r="34"/><text x="150" y="295" text-anchor="middle">回避冲突</text></g><g class="node event"><circle cx="540" cy="285" r="34"/><text x="540" y="290" text-anchor="middle">寻求认可</text></g></svg><div class="legend"><span><i class="dot" style="background:#6575f7"></i>人物</span><span><i class="dot" style="background:#a58bfa"></i>性格 / 动机</span><span><i class="dot" style="background:#79c8bb"></i>行为模式</span></div></div>
<div class="card timeline"><h2>事件时间线</h2><div id="timeline"><div class="empty">还没有事件，先从左侧添加一条记录</div></div></div></section>
<aside class="card analysis"><h2>可解释分析</h2><div class="sub">基于当前输入动态更新</div><div class="metric"><div class="metric-top"><span>敏感性</span><b>78%</b></div><div class="bar"><i style="width:78%"></i></div></div><div class="metric"><div class="metric-top"><span>责任感</span><b>68%</b></div><div class="bar"><i style="width:68%"></i></div></div><div class="metric"><div class="metric-top"><span>冲突回避</span><b>72%</b></div><div class="bar"><i style="width:72%"></i></div></div><div class="insight"><b>当前核心心理</b><span id="psych">对他人评价较敏感，倾向先恢复心理安全，再处理关系冲突。</span></div><h2 style="margin-top:22px">未来行为推测</h2><div class="forecast"><b>触发条件</b><br>再次受到公开否定或失去控制感</div><div class="forecast"><b>可能行为</b><br>减少主动沟通（58%） · 私下解释（27%） · 突然退出（15%）</div><div class="forecast"><b>依据</b><br>过去记录中的情绪、行为结果和重复模式</div></aside>
</main><script>
const state={events:[],tags:new Set()}; const $=id=>document.getElementById(id); const today=new Date().toISOString().slice(0,10); $('date').value=today;
function render(){ $('count').textContent=state.events.length; $('completeness').textContent=Math.min(18+state.events.length*12,96)+'%'; $('tagbox').innerHTML=state.tags.size?[...state.tags].map(t=>`<span class="tag">${t}<button onclick="removeTag('${t}')">×</button></span>`).join(''):'<span class="empty">暂无标签</span>'; $('timeline').innerHTML=state.events.length?state.events.slice().reverse().map(e=>`<div class="event"><div class="date">${e.date}</div><div><b>${e.event}</b><p>${[...e.emotions,...e.traits].join(' · ')}${e.note?' · '+e.note:''}</p></div></div>`).join(''):'<div class="empty">还没有事件，先从左侧添加一条记录</div>'; localStorage.setItem('portrait-network',JSON.stringify({events:state.events,tags:[...state.tags]}));}
function removeTag(t){state.tags.delete(t);render()} $('add').onclick=()=>{let event=$('event').value.trim();if(!event)return $('event').focus();let emotions=$('emotion').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),traits=$('traits').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);state.events.push({event,date:$('date').value||today,emotions,traits,note:$('note').value.trim()});[...emotions,...traits].forEach(t=>state.tags.add(t));['event','emotion','traits','note'].forEach(id=>$(id).value='');render()}; $('demo').onclick=()=>{$('event').value='被公开批评后，三天没有主动联系同事';$('emotion').value='羞耻，焦虑';$('traits').value='敏感，冲突回避';$('note').value='在公开评价下更在意尊严与心理安全';};
try{let x=JSON.parse(localStorage.getItem('portrait-network'));if(x){state.events=x.events||[];state.tags=new Set(x.tags||[]);render()}}catch(e){}
</script></body></html>
